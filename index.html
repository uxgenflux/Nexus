<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harian</title>
<meta name="theme-color" content="#164A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Harian">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Harian: tugas, kalender, target, catatan, dan pengingat dalam satu aplikasi.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --ink:#16302C; --muted:#5B6F6B; --line:#D6E1DD; --chip:#E3EDE9;
  --accent:#164A44; --accent-ink:#FFFFFF; --amber:#F4B740; --amber-ink:#2B1D00;
  --coral:#C9483C; --sky:#3F7AAE; --ok:#2E8B6E;
  background:var(--bg);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1C1A; --surface:#142826; --ink:#E7F0ED; --muted:#98ADA8; --line:#254039; --chip:#1E3532;
    --accent:#F4B740; --accent-ink:#2B1D00; --amber:#F4B740; --amber-ink:#2B1D00;
    --coral:#F0806F; --sky:#78B0DD; --ok:#5CC7A4;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1C1A; --surface:#142826; --ink:#E7F0ED; --muted:#98ADA8; --line:#254039; --chip:#1E3532;
  --accent:#F4B740; --accent-ink:#2B1D00; --amber:#F4B740; --amber-ink:#2B1D00;
  --coral:#F0806F; --sky:#78B0DD; --ok:#5CC7A4;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:22px;height:22px;flex:none}
.muted{color:var(--muted)}

.app{max-width:560px;margin:0 auto;padding:16px 16px 112px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 16px}
.h1{font-size:32px;line-height:1.08;font-weight:800;letter-spacing:-.025em;margin:0}
.sub{color:var(--muted);font-size:14.5px;margin:4px 0 0}
.icon-btn{appearance:none;border:0;background:var(--chip);color:var(--ink);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;padding:0}
.icon-btn.sm{width:36px;height:36px;background:transparent;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.hero{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.hero-t b{display:block;font-size:18px;line-height:1.25;font-weight:700}
.hero-t span{font-size:14px;color:var(--muted)}
.ring{position:relative;width:72px;height:72px;flex:none}
.ring svg{width:100%;height:100%}
.rt{fill:none;stroke:var(--chip);stroke-width:8}
.rf{fill:none;stroke:var(--amber);stroke-width:8;stroke-linecap:round}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:16px}

.quick{display:flex;gap:8px;align-items:center;margin:0 0 14px}
.quick .inp{flex:1;min-width:0}
.inp{width:100%;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-height:46px}
.sheet .inp{background:var(--bg)}
textarea.inp{min-height:170px;resize:vertical;line-height:1.5}
.btn{appearance:none;border:0;border-radius:12px;padding:0 18px;min-height:46px;font-weight:700;background:var(--accent);color:var(--accent-ink);flex:none}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:transparent;color:var(--coral);border:1px solid var(--line)}
.btn.block{width:100%}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--chip);border-radius:12px;padding:4px;margin:0 0 6px}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;min-height:38px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}

.grp{font-size:13.5px;font-weight:700;color:var(--muted);margin:20px 4px 8px}
.grp.late{color:var(--coral)}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 8px 4px 4px;position:relative;overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--p,var(--line))}
.row[data-p="tinggi"]{--p:var(--coral)}
.row[data-p="sedang"]{--p:var(--amber)}
.row[data-p="rendah"]{--p:var(--sky)}
.chk{appearance:none;border:0;background:transparent;width:44px;height:44px;display:grid;place-items:center;padding:0;flex:none}
.box{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:transparent}
.box .ico{width:16px;height:16px;stroke-width:3}
.chk[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row-b{flex:1;min-width:0;appearance:none;border:0;background:transparent;text-align:left;padding:8px 4px;min-height:44px}
.row-t{display:block;font-weight:600;overflow-wrap:anywhere}
.row-m{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--muted);margin-top:1px}
.row-m .ico{width:14px;height:14px}
.row-m .late{color:var(--coral);font-weight:600}
.row.done .row-t{text-decoration:line-through;color:var(--muted)}
.row.plain{padding:8px 8px 8px 16px}
.row.plain .grow{flex:1;min-width:0}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:15px}

.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-head b{font-size:18px;font-weight:700}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
.day{appearance:none;border:1.5px solid transparent;background:var(--surface);border-radius:12px;aspect-ratio:1/1.05;font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.day.today{border-color:var(--accent)}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.t{background:var(--ok)}.dot.g{background:var(--amber)}.dot.r{background:var(--coral)}.dot.n{background:var(--sky)}
.day[aria-pressed="true"] .dot{background:var(--accent-ink)}
.day-acts{display:flex;gap:8px;margin:14px 0 4px}
.day-acts .btn{flex:1;min-height:42px}
.tag{display:inline-flex;align-items:center;gap:6px}

.goal{margin-bottom:10px}
.goal-h{appearance:none;border:0;background:transparent;width:100%;text-align:left;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:0 0 10px}
.goal-h b{display:block;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.goal-h small{color:var(--muted);font-size:13px}
.pct{font-weight:800;font-size:20px;letter-spacing:-.02em}
.bar-track{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--amber);border-radius:99px;transition:width .3s}
.steps{list-style:none;margin:12px 0 0;padding:0}
.steps li{display:flex;align-items:center;gap:2px}
.steps .st{flex:1;min-width:0;overflow-wrap:anywhere}
.steps .st.done{text-decoration:line-through;color:var(--muted)}
.goal-tools{display:flex;gap:8px;margin-top:8px}
.goal-tools .btn{min-height:42px}

.notes{display:flex;flex-direction:column;gap:8px}
.note{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.note-h{display:flex;gap:10px;align-items:center}
.note-h b{overflow-wrap:anywhere}
.mood{font-size:20px;line-height:1}
.pv{margin:6px 0 4px;color:var(--muted);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.note small{color:var(--muted);font-size:12.5px}
.search{margin:10px 0 12px}

.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:26px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.3;display:block;margin-top:2px}
.sec{margin-bottom:12px}
.sec h2{font-size:16px;font-weight:700;margin:0 0 10px}
.chart{width:100%;height:auto;display:block}
.chart .b{fill:var(--ok)}.chart .b.now{fill:var(--amber)}.chart .b.zero{fill:var(--line)}
.chart .l{fill:var(--muted);font-size:11px;font-weight:600}
.chart .v{fill:var(--ink);font-size:12px;font-weight:700}
.mini{margin-bottom:12px}
.mini:last-child{margin-bottom:0}
.mini-h{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;margin-bottom:5px}
.mini-h span:first-child{overflow-wrap:anywhere}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.moods span{background:var(--chip);border-radius:99px;padding:4px 12px;font-size:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;min-height:52px}
.tab[aria-current="page"]{color:var(--accent);background:var(--chip)}

.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(6,20,18,.55)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(0,0,0,.28);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sh-t{font-size:20px;font-weight:800;letter-spacing:-.015em;margin:0 0 4px}
.field label,.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg3 button{appearance:none;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;min-height:44px;font-weight:600}
.seg3 button[aria-checked="true"]{border-color:var(--accent);background:var(--chip)}
.moodpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.moodpick button{appearance:none;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;min-height:48px;font-size:24px;padding:0}
.moodpick button[aria-checked="true"]{border-color:var(--accent);background:var(--chip)}
.sw{display:flex;align-items:center;gap:12px;margin:16px 0 0;min-height:44px}
.sw input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.err{color:var(--coral);font-size:14px;font-weight:600;min-height:20px;margin:10px 0 0}
.sh-actions{display:flex;gap:8px;margin-top:10px}
.sh-actions .btn{flex:1}
.sh-actions .btn.danger{flex:none}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}

.banners{position:fixed;left:0;right:0;top:0;z-index:60;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.banner{pointer-events:auto;width:100%;max-width:560px;margin:0 auto;background:var(--amber);color:var(--amber-ink);border-radius:16px;padding:12px 12px 12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.banner .grow{flex:1;min-width:0}
.banner b{display:block;overflow-wrap:anywhere}
.banner small{font-size:13px;opacity:.85}
.banner button{appearance:none;border:0;border-radius:10px;min-height:40px;padding:0 12px;font-weight:700;background:rgba(43,29,0,.14);color:var(--amber-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:999px;font-size:14px;z-index:70;display:flex;gap:10px;align-items:center;max-width:calc(100% - 24px)}
.toast[hidden]{display:none}
.toast button{appearance:none;border:0;background:transparent;color:inherit;text-decoration:underline;font-weight:800;min-height:36px;padding:0 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="banners" id="banners" aria-live="assertive"></div>
<main class="app" id="view"></main>
<nav class="tabs" aria-label="Menu utama"><div class="tabs-in" id="tabs"></div></nav>
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="scrim" data-act="close-sheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';

/* ---------- utilitas ---------- */
const $=(s,el)=>(el||document).querySelector(s);
const $$=(s,el)=>Array.from((el||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parseYmd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const HR=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const MOODS=[{v:1,e:'😞',l:'Berat'},{v:2,e:'😕',l:'Kurang baik'},{v:3,e:'😐',l:'Biasa'},{v:4,e:'🙂',l:'Baik'},{v:5,e:'😄',l:'Sangat baik'}];
const PRIO={tinggi:'Tinggi',sedang:'Sedang',rendah:'Rendah'};
const PR_RANK={tinggi:0,sedang:1,rendah:2};

function daysFromToday(s){return Math.round((parseYmd(s)-parseYmd(today()))/864e5);}
function labelDate(s){
  if(!s) return '';
  const d=daysFromToday(s); if(d===0) return 'Hari ini'; if(d===1) return 'Besok'; if(d===-1) return 'Kemarin';
  const t=parseYmd(s); const y=t.getFullYear()!==new Date().getFullYear()?' '+t.getFullYear():'';
  return HR[t.getDay()]+', '+t.getDate()+' '+BLN[t.getMonth()]+y;
}

const ICONS={
  tugas:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h9"/>',
  kalender:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  catatan:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  statistik:'<path d="M18 20V10M12 20V4M6 20v-6"/>',
  bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  left:'<path d="M15 18l-6-6 6-6"/>',
  right:'<path d="M9 18l6-6-6-6"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  check:'<path d="M5 12l5 5L20 7"/>'
};
const ico=(n,c)=>'<svg class="ico '+(c||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>';

/* ---------- data & penyimpanan ---------- */
const LS_KEY='harian:v1';
const blank=()=>({tasks:[],goals:[],notes:[],reminders:[],fired:{},updatedAt:0});
function normalize(o){const b=blank();if(o&&typeof o==='object'){['tasks','goals','notes','reminders'].forEach(k=>{if(Array.isArray(o[k]))b[k]=o[k];});if(o.fired&&typeof o.fired==='object')b.fired=o.fired;b.updatedAt=+o.updatedAt||0;}return b;}
function loadLocal(){try{const r=localStorage.getItem(LS_KEY);if(r)return normalize(JSON.parse(r));}catch(e){}return blank();}
let S=loadLocal();
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}
function persist(){S.updatedAt=Date.now();saveLocal();}
function syncText(){
  let last='';try{last=localStorage.getItem('harian:lastBackup')||'';}catch(e){}
  return 'Data tersimpan di browser perangkat ini. '+(last?'Cadangan terakhir: '+labelDate(last)+'.':'Anda belum pernah membuat cadangan.');
}

/* ---------- state tampilan ---------- */
const n0=new Date();
const ui={tab:'tugas',filter:'aktif',calY:n0.getFullYear(),calM:n0.getMonth(),calSel:today(),openGoal:null,quick:'',search:''};
let sheetPrio='sedang',sheetMood=0,undoState=null;
const view=$('#view');

/* ---------- tampilan: tugas ---------- */
function topbar(title,sub){
  return '<header class="top"><div><h1 class="h1">'+esc(title)+'</h1><p class="sub">'+esc(sub)+'</p></div>'+
    '<button class="icon-btn" data-act="open-rem" aria-label="Pengingat">'+ico('bell')+'</button></header>';
}
function sortTasks(a,b){
  return (a.due||'9999').localeCompare(b.due||'9999')||(a.time||'99:99').localeCompare(b.time||'99:99')||(PR_RANK[a.prio]-PR_RANK[b.prio]);
}
function taskRow(t,inCal){
  const meta=[];
  if(t.due&&!inCal&&t.due!==today()){const late=!t.done&&t.due<today();meta.push('<span class="'+(late?'late':'')+'">'+esc(labelDate(t.due))+'</span>');}
  if(t.time)meta.push('<span>'+esc(t.time)+'</span>');
  if(t.remind)meta.push('<span class="tag">'+ico('bell')+'Pengingat</span>');
  meta.push('<span>'+PRIO[t.prio]+'</span>');
  return '<li class="row'+(t.done?' done':'')+'" data-p="'+esc(t.prio)+'">'+
    '<button class="chk" role="checkbox" aria-checked="'+(t.done?'true':'false')+'" aria-label="Tandai selesai: '+esc(t.title)+'" data-act="task-toggle" data-id="'+t.id+'"><span class="box">'+ico('check')+'</span></button>'+
    '<button class="row-b" data-act="task-edit" data-id="'+t.id+'"><span class="row-t">'+esc(t.title)+'</span><span class="row-m">'+meta.join('')+'</span></button></li>';
}
function vTugas(){
  const td=today(),d=new Date();
  const dueToday=S.tasks.filter(t=>t.due===td);
  const doneToday=dueToday.filter(t=>t.done).length;
  const waiting=S.tasks.filter(t=>!t.done&&t.due&&t.due<=td).length;
  const overdue=S.tasks.filter(t=>!t.done&&t.due&&t.due<td).length;
  let l1,l2;
  if(!dueToday.length&&!waiting){l1='Belum ada tugas hari ini';l2='Tulis satu di bawah untuk mulai.';}
  else if(!waiting){l1='Semua tugas hari ini beres';l2=doneToday+' tugas selesai.';}
  else{l1=waiting+' tugas menunggu';l2=overdue?overdue+' terlambat, '+doneToday+' selesai hari ini':doneToday+' dari '+dueToday.length+' selesai hari ini';}
  const C=2*Math.PI*30,frac=dueToday.length?doneToday/dueToday.length:0;
  const ring='<div class="ring" role="img" aria-label="'+doneToday+' dari '+dueToday.length+' tugas hari ini selesai"><svg viewBox="0 0 72 72"><circle class="rt" cx="36" cy="36" r="30"/><circle class="rf" cx="36" cy="36" r="30" transform="rotate(-90 36 36)" style="stroke-dasharray:'+C.toFixed(1)+';stroke-dashoffset:'+(C*(1-frac)).toFixed(1)+'"/></svg><span>'+doneToday+'/'+dueToday.length+'</span></div>';
  let h=topbar(HARI[d.getDay()],d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear());
  h+='<section class="card hero">'+ring+'<div class="hero-t"><b>'+esc(l1)+'</b><span>'+esc(l2)+'</span></div></section>';
  h+='<div class="quick"><input id="quick" class="inp" placeholder="Tambah tugas untuk hari ini" enterkeyhint="done" autocomplete="off" maxlength="140" value="'+esc(ui.quick)+'" aria-label="Nama tugas baru">'+
     '<button class="btn" data-act="task-quick">Tambah</button>'+
     '<button class="icon-btn" data-act="task-new" aria-label="Tambah tugas dengan detail">'+ico('sliders')+'</button></div>';
  h+='<div class="seg"><button data-act="task-filter" data-v="aktif" aria-pressed="'+(ui.filter==='aktif')+'">Aktif</button><button data-act="task-filter" data-v="selesai" aria-pressed="'+(ui.filter==='selesai')+'">Selesai</button></div>';
  if(ui.filter==='aktif'){
    const act=S.tasks.filter(t=>!t.done);
    const groups=[
      ['Terlambat',act.filter(t=>t.due&&t.due<td),'late'],
      ['Hari ini',act.filter(t=>t.due===td),''],
      ['Mendatang',act.filter(t=>t.due>td),''],
      ['Tanpa tanggal',act.filter(t=>!t.due),'']
    ];
    let any=false;
    groups.forEach(g=>{if(!g[1].length)return;any=true;h+='<h2 class="grp '+g[2]+'">'+g[0]+' ('+g[1].length+')</h2><ul class="list">'+g[1].sort(sortTasks).map(t=>taskRow(t)).join('')+'</ul>';});
    if(!any)h+='<p class="empty">Tidak ada tugas aktif.</p>';
  }else{
    const done=S.tasks.filter(t=>t.done).sort((a,b)=>b.doneAt-a.doneAt);
    if(!done.length)h+='<p class="empty">Belum ada tugas yang selesai.</p>';
    else h+='<ul class="list" style="margin-top:12px">'+done.map(t=>taskRow(t)).join('')+'</ul><div class="stack"><button class="btn danger" data-act="task-clear-done">Hapus semua yang selesai</button></div>';
  }
  return h;
}

/* ---------- tampilan: kalender ---------- */
function itemsOn(ds){
  return{
    tasks:S.tasks.filter(t=>t.due===ds),
    goals:S.goals.filter(g=>g.deadline===ds),
    rems:S.reminders.filter(r=>r.repeat==='daily'?r.date<=ds:r.date===ds),
    notes:S.notes.filter(n=>n.date===ds)
  };
}

/* ---------- tampilan: target ---------- */
function goalProgress(g){const n=g.steps.length;return n?Math.round(g.steps.filter(s=>s.done).length/n*100):0;}
function deadlineLabel(g){
  if(goalProgress(g)===100)return 'Tercapai';
  if(!g.deadline)return '';
  const d=daysFromToday(g.deadline);
  return d>0?d+' hari lagi':d===0?'Tenggat hari ini':'Terlambat '+(-d)+' hari';
}
function goalCard(g){
  const p=goalProgress(g),done=g.steps.filter(s=>s.done).length,open=ui.openGoal===g.id;
  const dl=deadlineLabel(g);
  let h='<article class="card goal"><button class="goal-h" data-act="goal-open" data-id="'+g.id+'" aria-expanded="'+open+'"><span><b>'+esc(g.title)+'</b><small>'+(g.steps.length?done+' dari '+g.steps.length+' langkah':'Belum ada langkah')+(dl?' · '+esc(dl):'')+'</small></span><span class="pct">'+p+'%</span></button>'+
    '<div class="bar-track"><div class="bar-fill" style="width:'+p+'%"></div></div>';
  if(open){
    h+='<ul class="steps">'+g.steps.map(s=>'<li><button class="chk" role="checkbox" aria-checked="'+(s.done?'true':'false')+'" aria-label="Tandai langkah: '+esc(s.text)+'" data-act="step-toggle" data-id="'+g.id+'" data-sid="'+s.id+'"><span class="box">'+ico('check')+'</span></button><span class="st'+(s.done?' done':'')+'">'+esc(s.text)+'</span><button class="icon-btn sm" data-act="step-del" data-id="'+g.id+'" data-sid="'+s.id+'" aria-label="Hapus langkah">'+ico('x')+'</button></li>').join('')+'</ul>';
    h+='<div class="quick" style="margin:10px 0 0"><input class="inp step-in" data-id="'+g.id+'" placeholder="Tambah langkah kecil" maxlength="140" autocomplete="off" aria-label="Langkah baru"><button class="btn ghost" data-act="step-add" data-id="'+g.id+'">Tambah</button></div>';
    h+='<div class="goal-tools"><button class="btn ghost" data-act="goal-edit" data-id="'+g.id+'">Ubah target</button></div>';
  }
  return h+'</article>';
}
function vTarget(){
  let h=topbar('Target','Pecah tujuan besar jadi langkah kecil');
  h+='<button class="btn block" data-act="goal-new" style="margin-bottom:14px">Target baru</button>';
  if(!S.goals.length)h+='<p class="empty">Belum ada target. Buat satu, lalu tambahkan langkah-langkahnya.</p>';
  else h+=S.goals.slice().sort((a,b)=>(goalProgress(a)===100)-(goalProgress(b)===100)||(a.deadline||'9999').localeCompare(b.deadline||'9999')).map(goalCard).join('');
  return h;
}

/* ---------- tampilan: statistik ---------- */
function last7(){const a=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(d);}return a;}
function doneOn(ds){return S.tasks.filter(t=>t.done&&t.doneAt&&ymd(new Date(t.doneAt))===ds).length;}
function streak(){
  const days=new Set(S.tasks.filter(t=>t.done&&t.doneAt).map(t=>ymd(new Date(t.doneAt))));
  const d=new Date();let n=0;
  if(!days.has(ymd(d)))d.setDate(d.getDate()-1);
  while(days.has(ymd(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
function chart7(cnt,days){
  const W=320,H=146,base=112,bw=30,gap=(W-bw*7)/8,max=Math.max(3,...cnt);
  let g='';
  cnt.forEach((c,i)=>{
    const x=gap+i*(bw+gap),h=c?Math.max(8,c/max*84):3,y=base-h;
    g+='<rect class="b'+(c?'':' zero')+(i===6&&c?' now':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" rx="7"/>';
    if(c)g+='<text class="v" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle">'+c+'</text>';
    g+='<text class="l" x="'+(x+bw/2).toFixed(1)+'" y="'+(base+20)+'" text-anchor="middle">'+HR[days[i].getDay()]+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Tugas selesai 7 hari terakhir: '+cnt.join(', ')+'">'+g+'</svg>';
}
function vStatistik(){
  const days=last7(),cnt=days.map(d=>doneOn(ymd(d))),week=cnt.reduce((a,b)=>a+b,0);
  const withDue=S.tasks.filter(t=>t.done&&t.doneAt&&t.due),onTime=withDue.filter(t=>ymd(new Date(t.doneAt))<=t.due).length;
  const pct=withDue.length?Math.round(onTime/withDue.length*100)+'%':'–';
  const st=streak();
  let h=topbar('Statistik','Ringkasan produktivitas Anda');
  h+='<div class="stats3"><div class="stat"><b>'+week+'</b><span>Tugas selesai 7 hari</span></div><div class="stat"><b>'+st+'</b><span>Hari beruntun</span></div><div class="stat"><b>'+pct+'</b><span>Selesai tepat waktu</span></div></div>';
  h+='<section class="card sec"><h2>Tugas selesai per hari</h2>'+chart7(cnt,days)+'</section>';
  h+='<section class="card sec"><h2>Progres target</h2>';
  if(!S.goals.length)h+='<p class="muted" style="margin:0">Belum ada target.</p>';
  else h+=S.goals.map(g=>{const p=goalProgress(g);return '<div class="mini"><div class="mini-h"><span>'+esc(g.title)+'</span><b>'+p+'%</b></div><div class="bar-track"><div class="bar-fill" style="width:'+p+'%"></div></div></div>';}).join('');
  h+='</section>';
  const since=new Date();since.setDate(since.getDate()-29);const sinceS=ymd(since);
  const recent=S.notes.filter(n=>n.date>=sinceS);
  const mc=MOODS.map(m=>({e:m.e,l:m.l,c:recent.filter(n=>n.mood===m.v).length})).filter(m=>m.c);
  h+='<section class="card sec"><h2>Catatan 30 hari terakhir</h2><p style="margin:0 0 '+(mc.length?'10':'0')+'px">'+recent.length+' catatan ditulis.</p>'+(mc.length?'<div class="moods">'+mc.map(m=>'<span title="'+esc(m.l)+'">'+m.e+' '+m.c+'</span>').join('')+'</div>':'')+'</section>';
  h+='<section class="card sec"><h2>Cadangan data</h2><p class="muted" id="syncTxt" style="margin:0 0 12px">'+esc(syncText())+'</p><div class="stack" style="margin-top:0"><button class="btn" data-act="export">Simpan cadangan</button><button class="btn ghost" data-act="import-pick">Pulihkan dari cadangan</button><button class="btn danger" data-act="reset-ask">Hapus semua data</button></div></section>';
  return h;
}

/* ---------- sheet & toast ---------- */
function openSheet(html,focusSel){
  $('#sheet').innerHTML=html;$('#sheetWrap').hidden=false;
  document.documentElement.style.overflow='hidden';
  $('#sheet').scrollTop=0;
  if(focusSel){const el=$(focusSel,$('#sheet'));if(el)setTimeout(()=>el.focus(),60);}
}
function closeSheet(){$('#sheetWrap').hidden=true;$('#sheet').innerHTML='';document.documentElement.style.overflow='';}
let toastTimer;
function toast(msg,action){
  const el=$('#toast');
  el.innerHTML='<span>'+esc(msg)+'</span>'+(action?'<button data-act="'+action.act+'">'+esc(action.label)+'</button>':'');
  el.hidden=false;clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.hidden=true;},action?5000:2600);
}
function setErr(msg,id){const e=$(id||'#f-err');if(e)e.textContent=msg;}

/* ---------- aksi: tugas ---------- */
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;t.doneAt=t.done?Date.now():0;
  if(t.done){banners=banners.filter(b=>b.taskId!==id);renderBanners();}
  persist();renderAll();
}
function quickAdd(){
  const inp=$('#quick'),title=(inp?inp.value:ui.quick).trim();
  if(!title){if(inp)inp.focus();return;}
  S.tasks.unshift({id:uid(),title:title,prio:'sedang',due:today(),time:'',remind:false,done:false,doneAt:0,createdAt:Date.now()});
  ui.quick='';persist();renderAll();
  const i=$('#quick');if(i)i.focus();
}

function saveTask(id){
  const title=$('#f-title').value.trim();
  if(!title)return setErr('Isi nama tugas dulu.');
  const due=$('#f-due').value,time=due?$('#f-time').value:'',remind=$('#f-remind').checked;
  if(remind&&(!due||!time))return setErr('Untuk pengingat, isi tanggal dan jam.');
  if(id){const t=S.tasks.find(x=>x.id===id);if(t){t.title=title;t.prio=sheetPrio;t.due=due;t.time=time;t.remind=remind;}}
  else S.tasks.unshift({id:uid(),title:title,prio:sheetPrio,due:due,time:time,remind:remind,done:false,doneAt:0,createdAt:Date.now()});
  ui.quick='';persist();closeSheet();renderAll();
}

/* ---------- aksi: hapus dengan urungkan ---------- */
const COLL={task:'tasks',goal:'goals',note:'notes',rem:'reminders'};
function delItem(kind,id){
  const arr=S[COLL[kind]],i=arr.findIndex(x=>x.id===id);if(i<0)return;
  undoState={kind:kind,item:arr[i],idx:i};arr.splice(i,1);
  if(kind==='task'){banners=banners.filter(b=>b.taskId!==id);renderBanners();}
  persist();closeSheet();renderAll();toast('Terhapus',{act:'undo',label:'Urungkan'});
}
function undoDelete(){
  if(!undoState)return;
  const arr=S[COLL[undoState.kind]];arr.splice(Math.min(undoState.idx,arr.length),0,undoState.item);
  undoState=null;persist();renderAll();$('#toast').hidden=true;
}

function saveGoal(id){
  const title=$('#g-title').value.trim();if(!title)return setErr('Isi target Anda dulu.');

/* ---------- aksi: catatan ---------- */
function openNoteSheet(id,dateStr){
  const n=id?S.notes.find(x=>x.id===id):null;
  const v=n||{date:dateStr||today(),mood:0,title:'',text:''};
  sheetMood=v.mood;
  openSheet('<h2 class="sh-t">'+(n?'Ubah catatan':'Catatan baru')+'</h2>'+
    '<div class="field"><label for="n-date">Tanggal</label><input id="n-date" type="date" class="inp" value="'+esc(v.date)+'"></div>'+
    '<div class="field"><span class="lbl">Suasana hati</span><div class="moodpick" id="moodBox" role="radiogroup" aria-label="Suasana hati">'+MOODS.map(m=>'<button type="button" role="radio" data-act="pick-mood" data-v="'+m.v+'" aria-label="'+m.l+'" aria-checked="'+(sheetMood===m.v)+'">'+m.e+'</button>').join('')+'</div></div>'+
    '<div class="field"><label for="n-title">Judul (opsional)</label><input id="n-title" class="inp" maxlength="100" autocomplete="off" value="'+esc(v.title)+'"></div>'+
    '<div class="field"><label for="n-text">Isi catatan</label><textarea id="n-text" class="inp" placeholder="Apa satu hal yang berjalan baik hari ini?">'+esc(v.text)+'</textarea></div>'+
    '<p class="err" id="f-err" role="alert"></p>'+
    '<div class="sh-actions">'+(n?'<button class="btn danger" data-act="note-del" data-id="'+n.id+'" aria-label="Hapus catatan">'+ico('trash')+'</button>':'')+
    '<button class="btn ghost" data-act="close-sheet">Batal</button><button class="btn" data-act="note-save" data-id="'+(n?n.id:'')+'">Simpan</button></div>',n?null:'#n-text');
}
function saveNote(id){
  const date=$('#n-date').value||today(),title=$('#n-title').value.trim(),text=$('#n-text').value.trim();
  if(!title&&!text)return setErr('Tulis judul atau isi catatan dulu.');
  if(id){const n=S.notes.find(x=>x.id===id);if(n){n.date=date;n.mood=sheetMood;n.title=title;n.text=text;n.updatedAt=Date.now();}}
  else S.notes.unshift({id:uid(),date:date,mood:sheetMood,title:title,text:text,createdAt:Date.now(),updatedAt:Date.now()});
  persist();closeSheet();renderAll();
}

/* ---------- pengingat ---------- */
let banners=[],audioCtx=null;
function notifState(){return('Notification' in window)?Notification.permission:'na';}
function reminderItems(now){
  const out=[];
  S.tasks.forEach(t=>{if(t.remind&&!t.done&&t.due&&t.time)out.push({key:'t:'+t.id+':'+t.due+'T'+t.time,title:t.title,at:new Date(t.due+'T'+t.time),taskId:t.id,time:t.time});});
  S.reminders.forEach(r=>{
    if(r.repeat==='daily'){const d=ymd(now);if(r.date<=d)out.push({key:'r:'+r.id+':'+d,title:r.title,at:new Date(d+'T'+r.time),taskId:'',time:r.time});}
    else out.push({key:'r:'+r.id+':'+r.date,title:r.title,at:new Date(r.date+'T'+r.time),taskId:'',time:r.time});
  });
  return out;
}
function checkReminders(){
  const now=new Date();let changed=false;
  reminderItems(now).forEach(it=>{
    if(S.fired[it.key])return;
    const diff=now-it.at;
    if(diff>=0){S.fired[it.key]=1;changed=true;if(diff<12*36e5)fire(it,diff>120000);}
  });
  if(changed){
    const ks=Object.keys(S.fired);if(ks.length>400)ks.slice(0,ks.length-400).forEach(k=>delete S.fired[k]);
    persist();
  }
}
function fire(it,late){
  banners.push({id:uid(),title:it.title,taskId:it.taskId,late:late,time:it.time});
  renderBanners();beep();
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
  sysNotify(it.title,late?'Pengingat terlewat ('+it.time+')':'Waktunya sekarang');
}
function sysNotify(title,body){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const plain=()=>{try{new Notification(title,{body:body,icon:'icon-192.png'});}catch(e){}};
    if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(reg=>{
        if(reg&&reg.showNotification)reg.showNotification(title,{body:body,icon:'icon-192.png',badge:'icon-192.png',tag:'harian-reminder',vibrate:[200,100,200]});
        else plain();
      }).catch(plain);
    }else plain();
  }catch(e){}
}
function renderBanners(){
  $('#banners').innerHTML=banners.map(b=>'<div class="banner" role="alert"><span class="grow"><b>'+esc(b.title)+'</b><small>'+(b.late?'Terlewat, dijadwalkan ':'Sekarang, ')+esc(b.time)+'</small></span>'+
    (b.taskId?'<button data-act="banner-done" data-id="'+b.id+'">Selesai</button>':'')+'<button data-act="banner-close" data-id="'+b.id+'">Tutup</button></div>').join('');
}
function unlockAudio(){
  try{if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)audioCtx=new A();}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}catch(e){}
}
function beep(){
  try{
    if(!audioCtx)return;
    [0,0.22].forEach((off,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+off;
      o.type='sine';o.frequency.value=i?988:784;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+0.22);
    });
  }catch(e){}
}
function nowPlus(min){const d=new Date(Date.now()+min*60000);return pad(d.getHours())+':'+pad(d.getMinutes());}
function openRemSheet(){
  const ns=notifState(),td=today();
  const nText={granted:'Notifikasi browser aktif.',denied:'Notifikasi diblokir di browser ini. Pengingat tetap muncul di dalam aplikasi.',na:'Browser ini belum mendukung notifikasi. Pengingat tetap muncul di dalam aplikasi.','default':'Notifikasi browser belum diaktifkan.'}[ns]||'';
  const items=[];
  S.reminders.forEach(r=>{
    const past=r.repeat!=='daily'&&(r.date+'T'+r.time)<(td+'T'+nowPlus(0));
    items.push({k:(r.repeat==='daily'?td:r.date)+'T'+r.time,id:r.id,title:r.title,when:(r.repeat==='daily'?'Setiap hari':labelDate(r.date))+' · '+r.time+(past?' · sudah lewat':''),del:true});
  });
  S.tasks.filter(t=>t.remind&&!t.done&&t.due&&t.time).forEach(t=>items.push({k:t.due+'T'+t.time,id:t.id,title:t.title,when:labelDate(t.due)+' · '+t.time+' · dari tugas',del:false}));
  items.sort((a,b)=>a.k.localeCompare(b.k));
  const list=items.length?'<ul class="list" style="margin-top:12px">'+items.map(i=>'<li class="row plain"><div class="grow"><span class="row-t">'+esc(i.title)+'</span><span class="row-m"><span>'+esc(i.when)+'</span></span></div>'+(i.del?'<button class="icon-btn sm" data-act="rem-del" data-id="'+i.id+'" aria-label="Hapus pengingat">'+ico('trash')+'</button>':'')+'</li>').join('')+'</ul>':'<p class="empty" style="padding:14px 8px">Belum ada pengingat.</p>';
  openSheet('<h2 class="sh-t">Pengingat</h2>'+
    '<p class="hint">Pengingat berbunyi selama aplikasi ini terbuka, termasuk saat layar di tab lain. '+esc(nText)+'</p>'+
    '<div class="stack" style="margin-top:10px;flex-direction:row;flex-wrap:wrap">'+(ns==='default'?'<button class="btn" data-act="notif-enable">Aktifkan notifikasi</button>':'')+'<button class="btn ghost" data-act="rem-test">Uji pengingat</button></div>'+
    list+
    '<div class="field"><label for="r-title">Pengingat baru</label><input id="r-title" class="inp" maxlength="120" autocomplete="off" placeholder="Contoh: Minum obat"></div>'+
    '<div class="two"><div class="field"><label for="r-date">Tanggal</label><input id="r-date" type="date" class="inp" value="'+td+'"></div><div class="field"><label for="r-time">Jam</label><input id="r-time" type="time" class="inp" value="'+nowPlus(10)+'"></div></div>'+
    '<div class="field"><label for="r-rep">Ulangi</label><select id="r-rep" class="inp"><option value="none">Sekali saja</option><option value="daily">Setiap hari</option></select></div>'+
    '<p class="err" id="r-err" role="alert"></p>'+
    '<div class="sh-actions"><button class="btn ghost" data-act="close-sheet">Tutup</button><button class="btn" data-act="rem-add">Tambah pengingat</button></div>');
}
async function enableNotif(){
  if(!('Notification' in window)){toast('Browser ini belum mendukung notifikasi');return;}
  try{await Notification.requestPermission();}catch(e){}
  openRemSheet();
}

/* ---------- cadangan ---------- */
let pendingImport=null;
function exportData(){
  try{
    const payload={app:'harian',version:1,exportedAt:new Date().toISOString(),data:S};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='harian-cadangan-'+today()+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    try{localStorage.setItem('harian:lastBackup',today());}catch(e){}
    updateSyncLabel();toast('Cadangan disimpan ke folder Unduhan');
  }catch(e){toast('Cadangan gagal dibuat');}
}
function updateSyncLabel(){const el=$('#syncTxt');if(el)el.textContent=syncText();}
function readImportFile(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(r.result);
      if(!p||p.app!=='harian'||!p.data||typeof p.data!=='object')throw new Error('format');
      const n=normalize(p.data);pendingImport=n;
      openSheet('<h2 class="sh-t">Pulihkan cadangan?</h2><p class="hint">Cadangan ini berisi '+n.tasks.length+' tugas, '+n.goals.length+' target, '+n.notes.length+' catatan, dan '+n.reminders.length+' pengingat. Data di aplikasi sekarang akan diganti.</p><div class="sh-actions" style="margin-top:18px"><button class="btn ghost" data-act="close-sheet">Batal</button><button class="btn" data-act="import-do">Ya, pulihkan</button></div>');
    }catch(e){toast('File ini bukan cadangan Harian yang valid');}
  };
  r.onerror=()=>toast('File tidak bisa dibaca');
  r.readAsText(file);
}
function doImport(){
  if(!pendingImport)return;
  S=pendingImport;pendingImport=null;persist();banners=[];renderBanners();closeSheet();ui.openGoal=null;renderAll();toast('Data berhasil dipulihkan');
}

/* ---------- reset ---------- */
function openResetSheet(){
  openSheet('<h2 class="sh-t">Hapus semua data?</h2><p class="hint">Semua tugas, target, catatan, dan pengingat akan dihapus dari perangkat ini dan akun Anda. Tindakan ini tidak bisa diurungkan.</p>'+
    '<div class="sh-actions" style="margin-top:18px"><button class="btn ghost" data-act="close-sheet">Batal</button><button class="btn danger" data-act="reset-do" style="flex:1">Ya, hapus semua</button></div>');
}

/* ---------- event ---------- */
document.addEventListener('pointerdown',unlockAudio,{passive:true});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'tab':ui.tab=el.dataset.tab;renderAll();window.scrollTo(0,0);break;
    case 'close-sheet':closeSheet();break;
    case 'undo':undoDelete();break;
    case 'open-rem':openRemSheet();break;
    /* tugas */
    case 'task-toggle':toggleTask(id);break;
    case 'task-edit':openTaskSheet(id);break;
    case 'task-quick':quickAdd();break;
    case 'task-new':{const q=$('#quick');const title=ui.tab==='tugas'&&q?q.value.trim():'';ui.quick='';openTaskSheet(null,{title:title,due:el.dataset.d||(ui.tab==='tugas'?today():'')});break;}
    case 'task-filter':ui.filter=el.dataset.v;renderAll();break;
    case 'task-clear-done':S.tasks=S.tasks.filter(t=>!t.done);persist();renderAll();toast('Tugas selesai dihapus');break;
    case 'pick-prio':sheetPrio=el.dataset.v;$('#prioBox').innerHTML=prioButtons();break;
    case 'task-save':saveTask(id);break;
    case 'task-del':delItem('task',id);break;
    /* kalender */
    case 'cal-prev':ui.calM--;if(ui.calM<0){ui.calM=11;ui.calY--;}renderAll();break;
    case 'cal-next':ui.calM++;if(ui.calM>11){ui.calM=0;ui.calY++;}renderAll();break;
    case 'cal-today':{const n=new Date();ui.calY=n.getFullYear();ui.calM=n.getMonth();ui.calSel=today();renderAll();break;}
    case 'cal-pick':ui.calSel=el.dataset.d;renderAll();break;
    /* target */
    case 'goal-new':openGoalSheet();break;
    case 'goal-edit':openGoalSheet(id);break;
    case 'goal-save':saveGoal(id);break;
    case 'goal-del':if(ui.openGoal===id)ui.openGoal=null;delItem('goal',id);break;
    case 'goal-open':ui.openGoal=ui.openGoal===id?null:id;renderAll();break;
    case 'step-toggle':{const g=S.goals.find(x=>x.id===id),s=g&&g.steps.find(x=>x.id===el.dataset.sid);if(s){s.done=!s.done;s.doneAt=s.done?Date.now():0;persist();renderAll();}break;}
    case 'step-del':{const g=S.goals.find(x=>x.id===id);if(g){g.steps=g.steps.filter(x=>x.id!==el.dataset.sid);persist();renderAll();}break;}
    case 'step-add':{const inp=el.parentElement.querySelector('.step-in');addStep(id,inp?inp.value:'');break;}
    /* catatan */
    case 'note-new':openNoteSheet(null,el.dataset.d);break;
    case 'note-edit':openNoteSheet(id);break;
    case 'note-save':saveNote(id);break;
    case 'note-del':delItem('note',id);break;
    case 'pick-mood':{const v=+el.dataset.v;sheetMood=sheetMood===v?0:v;$$('#moodBox button').forEach(b=>b.setAttribute('aria-checked',String(+b.dataset.v===sheetMood)));break;}
    /* pengingat */
    case 'notif-enable':enableNotif();break;
    case 'rem-test':unlockAudio();fire({title:'Pengingat uji coba',taskId:'',time:nowPlus(0)},false);break;
    case 'rem-add':{
      const title=$('#r-title').value.trim(),date=$('#r-date').value,time=$('#r-time').value,repeat=$('#r-rep').value;
      if(!title||!date||!time)return setErr('Isi nama, tanggal, dan jam pengingat.','#r-err');
      S.reminders.push({id:uid(),title:title,date:date,time:time,repeat:repeat});
      persist();openRemSheet();renderAll();toast('Pengingat ditambahkan');checkReminders();break;
    }
    case 'rem-del':{const i=S.reminders.findIndex(x=>x.id===id);if(i>=0){undoState={kind:'rem',item:S.reminders[i],idx:i};S.reminders.splice(i,1);persist();openRemSheet();renderAll();toast('Terhapus',{act:'undo',label:'Urungkan'});}break;}
    case 'banner-close':banners=banners.filter(b=>b.id!==id);renderBanners();break;
    case 'banner-done':{const b=banners.find(x=>x.id===id);if(b&&b.taskId)toggleTask(b.taskId);banners=banners.filter(x=>x.id!==id);renderBanners();break;}
    /* data */
    case 'export':exportData();break;
    case 'import-pick':{const f=$('#importFile');if(f)f.click();break;}
    case 'import-do':doImport();break;
    case 'reset-ask':openResetSheet();break;
    case 'reset-do':S=blank();persist();banners=[];renderBanners();closeSheet();ui.openGoal=null;renderAll();toast('Semua data dihapus');break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sheetWrap').hidden){closeSheet();return;}
  if(e.key==='Enter'&&!e.isComposing){
    const t=e.target;
    if(t.id==='quick'){e.preventDefault();quickAdd();}
    else if(t.classList&&t.classList.contains('step-in')){e.preventDefault();addStep(t.dataset.id,t.value);}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='quick')ui.quick=t.value;
  else if(t.id==='search'){ui.search=t.value;const l=$('#noteList');if(l)l.innerHTML=noteListHtml();}
});
document.addEventListener('change',e=>{const t=e.target;if(t&&t.id==='importFile'){readImportFile(t.files&&t.files[0]);t.value='';}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders();if(!$('#sheetWrap').hidden)return;renderAll();}});

/* ---------- mulai ---------- */
renderAll();
checkReminders();
setInterval(checkReminders,15000);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
})();
</script>
